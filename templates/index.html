<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050608">
<meta name="color-scheme" content="dark">
<title>西桟橋 — Starlink</title>
<link rel="manifest" href="/manifest.json">
<style>
  /* ==========================================================
     西桟橋 Starlink Viewer — Design System v3
     - Apple HIG: Clarity / Deference / Depth
     - Japanese ma: 余白と静寂
     - 天文観測: 暗順応アンバー（#ffb86b 系）で夜の目を守る
     - WCAG AA 4.5:1 以上（重要情報）
     ========================================================== */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* ---- パレット：夜の階調 + アンバー（暗順応配慮） ---- */
    --bg-0:      #05070a;          /* 最深 */
    --bg-1:      #080b10;
    --bg-2:      #0c1017;

    --ink-100:   rgba(245, 238, 226, 0.94);   /* 主文字（わずかに暖色） */
    --ink-80:    rgba(245, 238, 226, 0.72);
    --ink-60:    rgba(245, 238, 226, 0.48);
    --ink-40:    rgba(245, 238, 226, 0.28);
    --ink-20:    rgba(245, 238, 226, 0.14);
    --ink-10:    rgba(245, 238, 226, 0.07);
    --hairline:  rgba(245, 238, 226, 0.06);

    /* アンバー：暗所でも眩しくない数値強調色 */
    --amber:     #ffb86b;
    --amber-dim: #b87e47;
    --amber-subtle: rgba(255, 184, 107, 0.15);

    /* 季節感の空色（JSで動的更新） */
    --sky-hue: 220;
    --sky-sat: 40%;
    --sky-light: 10%;

    /* タイポ */
    --font-mincho: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --font-sans:   -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-tnum:   "SF Mono", ui-monospace, "Menlo", monospace;

    /* タイポサイズ（黄金比 1.618） */
    --size-hero:    7rem;     /* 時刻 */
    --size-large:   1.618rem;
    --size-base:    1rem;
    --size-small:   0.8rem;
    --size-tiny:    0.7rem;
    --size-micro:   0.62rem;  /* ラベル */

    /* モーション */
    --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur-slow: 1.8s;
    --dur-med:  1.0s;
    --dur-fast: 0.3s;
  }

  /* ---- Reduce Motion 対応 ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font-mincho);
    color: var(--ink-100);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: max(2rem, env(safe-area-inset-top)) 1.5rem 5rem;
    text-align: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    position: relative;

    /* 時刻連動背景: 下から上へ夜空が立ち上がる */
    background:
      radial-gradient(ellipse 130% 70% at 50% 105%,
        hsla(var(--sky-hue), var(--sky-sat), var(--sky-light), 1) 0%,
        var(--bg-0) 65%);
    background-attachment: fixed;
    background-color: var(--bg-0);
    transition: background 1.5s var(--ease-out);
    font-feature-settings: "palt" 1, "pwid" 1;
  }

  /* ---- 星（単一レイヤー・瞬きのみ） ---- */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(0.8px 0.8px at 18% 24%, rgba(255,240,220,.6), transparent 52%),
      radial-gradient(0.8px 0.8px at 73% 16%, rgba(255,240,220,.5), transparent 52%),
      radial-gradient(0.8px 0.8px at 52% 78%, rgba(255,240,220,.4), transparent 52%),
      radial-gradient(0.8px 0.8px at 12% 68%, rgba(255,240,220,.5), transparent 52%),
      radial-gradient(1px   1px   at 88% 55%, rgba(255,240,220,.35),transparent 52%),
      radial-gradient(0.8px 0.8px at 38% 12%, rgba(255,240,220,.45),transparent 52%),
      radial-gradient(0.8px 0.8px at 62% 46%, rgba(255,240,220,.3), transparent 52%),
      radial-gradient(0.8px 0.8px at 28% 88%, rgba(255,240,220,.4), transparent 52%),
      radial-gradient(0.8px 0.8px at 84% 82%, rgba(255,240,220,.35),transparent 52%),
      radial-gradient(0.8px 0.8px at 8%  38%, rgba(255,240,220,.3), transparent 52%);
    animation: twinkle 9s ease-in-out infinite;
    opacity: 0.75;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50%      { opacity: 0.45; }
  }

  /* ==========================================================
     レイアウト
     ========================================================== */
  main {
    position: relative;
    z-index: 1;
    max-width: 32rem;
    width: 100%;
  }

  /* ---- ヘッダー（Now レイヤー） ---- */
  .place {
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    letter-spacing: 0.55em;
    color: var(--ink-40);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
  }
  .place::first-letter {
    /* 日本語なので機能しない。英字混入時の保険 */
  }
  .place-jp {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    letter-spacing: 0.5em;
    color: var(--ink-60);
    margin-bottom: 0.6rem;
  }

  .date {
    font-family: var(--font-tnum);
    font-size: var(--size-small);
    color: var(--ink-40);
    letter-spacing: 0.15em;
    margin-bottom: 2rem;
    font-feature-settings: "tnum" 1;
  }

  /* ==========================================================
     Observation Index（最上位バッジ）
     ========================================================== */
  .obs-index {
    max-width: 22rem;
    margin: 0 auto 2.5rem;
    padding: 1.5rem 1.4rem 1.4rem;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 184, 107, 0.08), transparent 70%),
      linear-gradient(180deg, rgba(255, 184, 107, 0.04), rgba(255, 184, 107, 0.015));
    border: 1px solid rgba(255, 184, 107, 0.2);
    border-radius: 8px;
    text-align: center;
    animation: fadeUp 1.2s var(--ease-out) both;
    position: relative;
  }
  .obs-index.has-train::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 8px;
    border: 1px solid var(--amber);
    opacity: 0;
    animation: indexPulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes indexPulse {
    0%, 100% { opacity: 0; }
    50%      { opacity: 0.6; }
  }
  .obs-index-label {
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    color: var(--ink-40);
    letter-spacing: 0.4em;
    margin-bottom: 0.6rem;
  }
  .obs-index-number {
    font-family: var(--font-tnum);
    font-size: 3.6rem;
    font-weight: 100;
    color: var(--amber);
    letter-spacing: 0.02em;
    line-height: 1;
    text-shadow: 0 0 30px rgba(255, 184, 107, 0.22);
    font-variant-numeric: tabular-nums;
    display: inline-block;
  }
  .obs-index-unit {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-40);
    letter-spacing: 0.3em;
    margin-top: 0.15rem;
    margin-bottom: 0.6rem;
  }
  .obs-index-bar {
    width: 70%;
    height: 2px;
    background: var(--ink-10);
    margin: 0.3rem auto 0.5rem;
    border-radius: 1px;
    overflow: hidden;
  }
  .obs-index-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition: width 1.2s var(--ease-out);
    box-shadow: 0 0 6px rgba(255, 184, 107, 0.5);
  }
  .obs-index-grade {
    font-family: var(--font-mincho);
    font-size: var(--size-base);
    color: var(--ink-100);
    letter-spacing: 0.2em;
    margin-bottom: 1rem;
  }
  .obs-index-divider {
    width: 2rem;
    height: 1px;
    background: var(--ink-20);
    margin: 0 auto 0.9rem;
  }
  .obs-index-time {
    font-family: var(--font-tnum);
    font-size: 1.2rem;
    font-weight: 200;
    color: var(--amber);
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    font-variant-numeric: tabular-nums;
  }
  .obs-index-direction {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    color: var(--ink-80);
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }
  .obs-index-advice {
    font-family: var(--font-mincho);
    font-size: var(--size-tiny);
    color: var(--ink-60);
    line-height: 1.8;
    letter-spacing: 0.05em;
    padding: 0 0.4rem;
  }

  /* アクションボタン群 */
  .obs-index-actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 1.2rem;
  }
  .ics-btn, .compass-btn {
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    letter-spacing: 0.15em;
    color: var(--amber);
    background: transparent;
    border: 1px solid rgba(255, 184, 107, 0.3);
    border-radius: 999px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
    text-decoration: none;
    transition: all var(--dur-fast);
    font-feature-settings: "palt" 1;
  }
  .ics-btn:hover, .compass-btn:hover {
    background: rgba(255, 184, 107, 0.1);
    border-color: var(--amber);
  }
  .ics-btn:focus-visible, .compass-btn:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: 2px;
  }

  /* コンパス表示 */
  .compass-wrap {
    margin-top: 1.4rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--hairline);
  }
  .compass-ring {
    width: 6rem;
    height: 6rem;
    margin: 0 auto 0.8rem;
    border: 1px solid rgba(255, 184, 107, 0.35);
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(255,184,107,0.06), transparent 70%);
  }
  .compass-arrow {
    font-size: 2rem;
    color: var(--amber);
    transition: transform 0.3s var(--ease-out);
    text-shadow: 0 0 12px rgba(255, 184, 107, 0.5);
    line-height: 1;
  }
  .compass-target {
    position: absolute;
    bottom: -0.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-tnum);
    font-size: var(--size-micro);
    color: var(--ink-60);
    background: var(--bg-0);
    padding: 0 0.4rem;
    letter-spacing: 0.15em;
    font-variant-numeric: tabular-nums;
  }
  .compass-hint {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-60);
    letter-spacing: 0.2em;
    font-variant-numeric: tabular-nums;
  }
  .compass-wrap.compass-on-target .compass-arrow {
    color: #a8e063;
    text-shadow: 0 0 18px rgba(168, 224, 99, 0.5);
  }
  .compass-wrap.compass-on-target .compass-hint {
    color: #a8e063;
  }

  /* A2: 観測時刻5分前の強調モード */
  .obs-index.about-to-start {
    animation: urgentPulse 1.6s ease-in-out infinite, fadeUp 1.2s var(--ease-out) both;
    border-color: var(--amber);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 184, 107, 0.18), transparent 70%),
      linear-gradient(180deg, rgba(255, 184, 107, 0.08), rgba(255, 184, 107, 0.03));
  }
  @keyframes urgentPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 184, 107, 0); }
    50%      { box-shadow: 0 0 24px 2px rgba(255, 184, 107, 0.35); }
  }
  .obs-index.about-to-start .obs-index-advice::before {
    content: "▸ 見え始めまで間もなく";
    display: block;
    color: var(--amber);
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    letter-spacing: 0.2em;
    margin-bottom: 0.5rem;
    animation: fadeUp 0.6s ease both;
  }

  /* ==========================================================
     Tonight レイヤー — 可視時
     ========================================================== */
  .visible {
    animation: fadeUp 1.4s var(--ease-out) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .visible .status {
    font-family: var(--font-mincho);
    font-size: var(--size-base);
    color: var(--ink-60);
    margin-bottom: 3rem;
    letter-spacing: 0.15em;
    line-height: 2;
  }

  /* 時刻：主役 */
  .visible .time {
    font-family: var(--font-tnum);
    font-size: var(--size-hero);
    font-weight: 100;
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 1rem;
    color: var(--amber);
    font-feature-settings: "tnum" 1;
    text-shadow: 0 0 40px rgba(255, 184, 107, 0.18);
  }

  .visible .countdown {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-40);
    letter-spacing: 0.25em;
    margin-bottom: 3rem;
    font-feature-settings: "tnum" 1;
    min-height: 1rem;
  }

  /* 可視スコア（アンバーバー） */
  .score-bar {
    width: 14rem;
    max-width: 60%;
    height: 2px;
    background: var(--ink-10);
    margin: 0 auto 0.7rem;
    border-radius: 1px;
    overflow: hidden;
  }
  .score-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition: width var(--dur-slow) var(--ease-out);
    box-shadow: 0 0 8px rgba(255, 184, 107, 0.4);
  }
  .score-label {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-60);
    letter-spacing: 0.25em;
    margin-bottom: 3rem;
    font-feature-settings: "tnum" 1;
  }
  .score-label strong {
    color: var(--amber);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    margin: 0 0.15em;
  }
  .score-unit {
    color: var(--ink-40);
    font-size: 0.8em;
    margin-left: 0.2em;
  }

  /* 方角 */
  .visible .direction {
    font-family: var(--font-mincho);
    font-size: var(--size-large);
    line-height: 2;
    color: var(--ink-100);
    letter-spacing: 0.08em;
  }
  .visible .direction .context {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-40);
    margin-left: 0.6rem;
    letter-spacing: 0.15em;
  }

  /* 流れ線 */
  .visible .flow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin: 1.6rem 0;
  }
  .visible .flow .line {
    flex: 0 0 4rem;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
    position: relative;
    overflow: hidden;
  }
  .visible .flow .line::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    animation: sweep 4.2s var(--ease-out) infinite;
  }
  @keyframes sweep {
    0%   { left: -40%; }
    100% { left: 140%; }
  }

  .visible .count {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-60);
    margin-top: 3rem;
    letter-spacing: 0.2em;
    font-feature-settings: "tnum" 1;
  }

  /* ---- 他の候補（Later レイヤー1） ---- */
  .others {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--hairline);
    animation: fadeUp 2s var(--ease-out) both;
  }
  .others-label {
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    color: var(--ink-40);
    letter-spacing: 0.4em;
    margin-bottom: 1.4rem;
    text-align: center;
  }
  .other-row {
    display: grid;
    grid-template-columns: 3.2rem 1fr 2.5rem 2rem;
    gap: 1rem;
    padding: 0.6rem 0.4rem;
    font-family: var(--font-sans);
    font-size: var(--size-small);
    color: var(--ink-80);
    font-feature-settings: "tnum" 1;
    align-items: baseline;
    border-bottom: 1px solid var(--hairline);
  }
  .other-row:last-child { border-bottom: none; }
  .other-time {
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .other-dir {
    font-size: var(--size-tiny);
    color: var(--ink-60);
    letter-spacing: 0.1em;
  }
  .other-count {
    font-size: var(--size-tiny);
    color: var(--ink-40);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .other-score {
    font-family: var(--font-tnum);
    font-size: var(--size-tiny);
    color: var(--amber-dim);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ==========================================================
     Tonight レイヤー — 不可視時
     ========================================================== */
  .not-visible .status {
    font-family: var(--font-mincho);
    font-size: var(--size-large);
    color: var(--ink-80);
    line-height: 2.2;
    letter-spacing: 0.12em;
    animation: fadeUp 1.4s var(--ease-out) both;
  }

  /* 見えない理由カード */
  .reason-card {
    margin-top: 2.6rem;
    padding: 1.8rem 1.4rem;
    background: var(--amber-subtle);
    border: 1px solid rgba(255, 184, 107, 0.2);
    border-radius: 4px;
    max-width: 22rem;
    margin-left: auto;
    margin-right: auto;
    animation: fadeUp 1.6s var(--ease-out) both;
  }
  .reason-icon {
    font-size: 1.8rem;
    margin-bottom: 0.6rem;
    line-height: 1;
  }
  .reason-title {
    font-family: var(--font-mincho);
    font-size: var(--size-base);
    color: var(--amber);
    margin-bottom: 0.7rem;
    letter-spacing: 0.1em;
  }
  .reason-detail {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    color: var(--ink-80);
    line-height: 1.9;
    letter-spacing: 0.05em;
  }

  .next-hint {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--hairline);
    animation: fadeUp 1.8s var(--ease-out) both;
  }
  .next-label {
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    color: var(--ink-40);
    letter-spacing: 0.4em;
    margin-bottom: 1.2rem;
  }
  .next-date {
    font-family: var(--font-mincho);
    font-size: var(--size-large);
    color: var(--amber);
    margin-bottom: 0.6rem;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
  }
  .next-dir {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-60);
    letter-spacing: 0.15em;
  }

  /* ==========================================================
     Later レイヤー2 — 月・空・潮（折りたたみ）
     ========================================================== */
  .moon-info {
    margin-top: 3.5rem;
    padding-top: 2rem;
    border-top: 1px solid var(--hairline);
    animation: fadeUp 2.2s var(--ease-out) both;
  }
  .moon-toggle {
    background: none;
    border: none;
    color: var(--ink-80);
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    letter-spacing: 0.25em;
    cursor: pointer;
    padding: 0.8rem 1.2rem;
    transition: color var(--dur-fast);
    border-radius: 2px;
  }
  .moon-toggle:hover { color: var(--ink-100); }
  .moon-toggle:focus-visible {
    outline: 1px solid var(--amber-dim);
    outline-offset: 4px;
  }
  .moon-toggle-preview {
    color: var(--ink-60);
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    margin-left: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .moon-toggle::after {
    content: "▾";
    margin-left: 0.8rem;
    display: inline-block;
    transition: transform var(--dur-fast);
    color: var(--ink-40);
  }
  .moon-toggle[aria-expanded="true"]::after { transform: rotate(180deg); }

  .moon-detail {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.5s var(--ease-out), opacity 0.5s var(--ease-out);
  }
  .moon-detail.open {
    max-height: 36rem;
    opacity: 1;
    margin-top: 1.4rem;
  }

  /* 空の時刻グリッド */
  .sky-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem 1.4rem;
    margin-bottom: 1.6rem;
    padding-bottom: 1.4rem;
    border-bottom: 1px solid var(--hairline);
  }
  .sky-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--font-sans);
    padding: 0.3rem 0;
  }
  .sky-cell:last-child { grid-column: span 2; }
  .sky-label {
    font-size: var(--size-micro);
    color: var(--ink-40);
    letter-spacing: 0.25em;
    margin-bottom: 0.35rem;
  }
  .sky-time {
    font-family: var(--font-tnum);
    font-size: var(--size-base);
    color: var(--ink-100);
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
  }

  /* 月サマリー */
  .moon-summary {
    padding-bottom: 1.4rem;
    margin-bottom: 1.4rem;
    border-bottom: 1px solid var(--hairline);
    text-align: center;
  }
  .moon-phase {
    font-family: var(--font-mincho);
    font-size: var(--size-large);
    color: var(--ink-100);
    margin-bottom: 0.5rem;
    letter-spacing: 0.08em;
  }
  .moon-meta {
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    color: var(--ink-60);
    margin-bottom: 0.4rem;
    letter-spacing: 0.2em;
    font-variant-numeric: tabular-nums;
  }
  .moon-note {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    color: var(--ink-60);
    letter-spacing: 0.15em;
    line-height: 1.8;
  }

  /* 天候（Open-Meteo） */
  .weather-block {
    padding: 1rem 0 1.2rem;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid var(--hairline);
    text-align: center;
  }
  .weather-line {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 0.8rem;
    margin-bottom: 0.4rem;
    font-family: var(--font-sans);
  }
  .weather-icon {
    font-size: 1.2rem;
  }
  .weather-state {
    font-family: var(--font-mincho);
    font-size: var(--size-base);
    color: var(--ink-100);
    letter-spacing: 0.1em;
  }
  .weather-cloud {
    font-size: var(--size-tiny);
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.15em;
  }
  .weather-note {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    color: var(--ink-60);
    letter-spacing: 0.1em;
    line-height: 1.8;
  }
  .weather-range {
    color: var(--ink-40);
    font-family: var(--font-sans);
    font-size: var(--size-tiny);
    margin-left: 0.4em;
    font-variant-numeric: tabular-nums;
  }

  /* 潮汐 */
  .tide-block {
    text-align: left;
    max-width: 18rem;
    margin: 0 auto;
  }
  .tide-list {
    list-style: none;
    padding: 0;
    margin: 0 0 0.7rem 0;
    font-family: var(--font-sans);
    font-size: var(--size-small);
    color: var(--ink-80);
    font-feature-settings: "tnum" 1;
  }
  .tide-list li {
    padding: 0.3rem 0;
    display: grid;
    grid-template-columns: 3rem 1fr auto;
    gap: 0.8rem;
    align-items: baseline;
    border-bottom: 1px dotted var(--hairline);
  }
  .tide-list li:last-child { border-bottom: none; }
  .tide-kind {
    color: var(--ink-60);
    font-size: var(--size-tiny);
    letter-spacing: 0.15em;
  }
  .tide-time {
    color: var(--ink-100);
    font-variant-numeric: tabular-nums;
  }
  .tide-cm {
    color: var(--ink-40);
    font-size: var(--size-tiny);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .tide-note {
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    color: var(--ink-40);
    letter-spacing: 0.2em;
    text-align: center;
    margin-top: 0.7rem;
  }

  /* ==========================================================
     ローディング
     ========================================================== */
  .loading {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    color: var(--ink-60);
    letter-spacing: 0.25em;
    animation: loadingPulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  .loading-text {
    margin-bottom: 1.2rem;
  }
  .loading-progress-wrap {
    animation: none;
    max-width: 14rem;
    margin: 0 auto;
  }
  .loading-progress-bar {
    width: 100%;
    height: 2px;
    background: var(--ink-10);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 0.6rem;
  }
  .loading-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    width: 0%;
    transition: width 0.5s linear;
    box-shadow: 0 0 6px rgba(255, 184, 107, 0.4);
  }
  .loading-progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    color: var(--ink-40);
    letter-spacing: 0.15em;
    font-variant-numeric: tabular-nums;
  }
  @keyframes loadingPulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.9; }
  }

  /* ==========================================================
     エラー
     ========================================================== */
  .error .status {
    font-family: var(--font-mincho);
    font-size: var(--size-small);
    color: rgba(255, 170, 140, 0.7);
    letter-spacing: 0.15em;
  }

  /* ==========================================================
     フッター
     ========================================================== */
  footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0; right: 0;
    font-family: var(--font-sans);
    font-size: var(--size-micro);
    color: var(--ink-20);
    letter-spacing: 0.45em;
    text-align: center;
    z-index: 1;
  }

  /* ==========================================================
     レスポンシブ
     ========================================================== */
  @media (min-width: 600px) {
    :root {
      --size-hero:  8.5rem;
    }
    .visible .direction { font-size: 1.8rem; }
    .place-jp { font-size: 0.9rem; }
  }

  @media (max-width: 400px) {
    :root {
      --size-hero:  5.2rem;
    }
    body { padding: 2rem 1.2rem 4.5rem; }
    .date { margin-bottom: 3.5rem; }
  }

  /* トランジション基本 */
  #content { transition: opacity var(--dur-med) var(--ease-out); }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<main>
  <div class="place">TAKETOMI · NISHI-SANBASHI</div>
  <div class="place-jp">竹富島・西桟橋</div>
  <div class="date">{{ target_date }}</div>

  <div id="content">
    <div class="loading">読み込み中<span class="loading-dots" aria-hidden="true">…</span></div>
  </div>
</main>

<footer>STARLINK TRAIN VIEWER</footer>

<script>
(() => {
  'use strict';

  // ==========================================================
  // 時刻連動背景（季節感ハイライト）
  // 18:00-18:45: 夕焼け残照（茜, hue 20, sat高, light 12%）
  // 18:45-19:30: 薄明（群青, hue 240, sat中, light 11%）
  // 19:30-22:00: 真夜中（深い青, hue 220, sat 30%, light 8%）
  // 22:00-  5:00: 漆黒（hue 220, sat 20%, light 5%）
  //  5:00-  6:00: 夜明け前（hue 200, sat 35%, light 10%）
  //  6:00- 17:30: 昼（薄く明るく）
  // ==========================================================
  function updateSky() {
    const now = new Date();
    const h = now.getHours() + now.getMinutes() / 60;
    let hue, sat, light;
    if (h >= 18 && h < 18.75) {
      hue = 20;  sat = 50; light = 12;
    } else if (h >= 18.75 && h < 19.5) {
      hue = 250; sat = 45; light = 11;
    } else if (h >= 19.5 && h < 22) {
      hue = 220; sat = 30; light = 8;
    } else if (h >= 22 || h < 5) {
      hue = 220; sat = 20; light = 5;
    } else if (h >= 5 && h < 6) {
      hue = 200; sat = 35; light = 10;
    } else {
      hue = 210; sat = 25; light = 7;
    }
    const r = document.documentElement;
    r.style.setProperty('--sky-hue', hue);
    r.style.setProperty('--sky-sat', sat + '%');
    r.style.setProperty('--sky-light', light + '%');
  }
  updateSky();
  setInterval(updateSky, 60 * 1000);

  // ==========================================================
  // カウントダウン
  // ==========================================================
  let countdownTimer = null;
  function startCountdown(isoTime) {
    const target = new Date(isoTime);
    const el = document.getElementById('countdown');
    if (!el) return;

    function tick() {
      const now = new Date();
      const diffMs = target - now;
      if (diffMs <= 0) {
        el.textContent = 'NOW — 空を見上げて';
        el.style.color = 'var(--amber)';
        clearInterval(countdownTimer);
        return;
      }
      const totalMin = Math.floor(diffMs / 60000);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (h > 0) {
        el.textContent = `あと ${h} 時間 ${m} 分`;
      } else if (m > 0) {
        el.textContent = `あと ${m} 分`;
      } else {
        const s = Math.floor(diffMs / 1000);
        el.textContent = `あと ${s} 秒`;
      }
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ==========================================================
  // 月情報トグル
  // ==========================================================
  function attachMoonToggle() {
    const btn = document.querySelector('.moon-toggle');
    const detail = document.querySelector('.moon-detail');
    if (!btn || !detail) return;
    btn.addEventListener('click', () => {
      const open = detail.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  // ==========================================================
  // 安全なエスケープ
  // ==========================================================
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ==========================================================
  // 観測インデックス（Observation Index）カード
  // ==========================================================
  function renderObservationIndex(d) {
    const idx = d.observation_index;
    if (!idx) return '';

    const hasTrain = idx.has_train;
    const pulseClass = hasTrain ? ' has-train' : '';

    return `
      <div class="obs-index${pulseClass}" role="status" aria-live="polite">
        <div class="obs-index-label">OBSERVATION INDEX</div>
        <div class="obs-index-number" aria-label="観測しやすさ ${escapeHtml(idx.score)}点">${escapeHtml(idx.score)}</div>
        <div class="obs-index-unit">/ 100</div>
        <div class="obs-index-bar" aria-hidden="true">
          <div class="obs-index-fill" style="width:${idx.score}%"></div>
        </div>
        <div class="obs-index-grade">${escapeHtml(idx.grade_jp)}</div>
        <div class="obs-index-divider" aria-hidden="true"></div>
        <div class="obs-index-time">${escapeHtml(idx.best_time_start)} 〜 ${escapeHtml(idx.best_time_end)}</div>
        <div class="obs-index-direction">${escapeHtml(idx.best_direction)}</div>
        <div class="obs-index-advice">${escapeHtml(idx.advice)}</div>
        <div class="obs-index-actions">
          <a class="ics-btn" href="/calendar.ics" download="starlink-nishi.ics">
            <span aria-hidden="true">📅</span> カレンダーに追加
          </a>
          <button class="compass-btn" id="compass-btn" type="button" hidden>
            <span aria-hidden="true">🧭</span> 方角ガイドを開始
          </button>
        </div>
        <div class="compass-wrap" id="compass-wrap" hidden aria-live="polite">
          <div class="compass-ring">
            <div class="compass-arrow" id="compass-arrow" aria-hidden="true">↑</div>
            <div class="compass-target" id="compass-target">—</div>
          </div>
          <div class="compass-hint" id="compass-hint">—</div>
        </div>
      </div>
    `;
  }

  // ==========================================================
  // コンパス（DeviceOrientation API）
  // ==========================================================
  // 8方位名→方位角（度、北=0、時計回り）
  const DIRECTION_DEG = {
    "北": 0, "北東": 45, "東": 90, "南東": 135,
    "南": 180, "南西": 225, "西": 270, "北西": 315,
  };

  function parseDirectionDeg(directionText) {
    // "南東（島の上空）→ 南" のような文字列から最初の方位名を抽出
    if (!directionText) return null;
    const match = directionText.match(/(北東|北西|南東|南西|北|東|南|西)/);
    if (!match) return null;
    return DIRECTION_DEG[match[1]];
  }

  function setupCompass(targetDeg) {
    const btn = document.getElementById('compass-btn');
    const wrap = document.getElementById('compass-wrap');
    const arrow = document.getElementById('compass-arrow');
    const target = document.getElementById('compass-target');
    const hint = document.getElementById('compass-hint');
    if (!btn || !wrap || targetDeg == null) return;

    // DeviceOrientation非対応デバイスではボタンを隠したまま
    if (typeof DeviceOrientationEvent === 'undefined') return;

    btn.hidden = false;
    target.textContent = Math.round(targetDeg) + '°';

    async function start() {
      // iOS 13+ は明示的許可が必要
      if (typeof DeviceOrientationEvent !== 'undefined'
          && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') {
            hint.textContent = 'コンパスの使用が許可されませんでした';
            return;
          }
        } catch (e) {
          hint.textContent = 'コンパスを有効化できませんでした';
          return;
        }
      }

      btn.hidden = true;
      wrap.hidden = false;

      window.addEventListener('deviceorientationabsolute', handler, true);
      window.addEventListener('deviceorientation', handler, true);
    }

    function handler(ev) {
      // alpha: デバイス上部が北からどれだけ時計回りに回転したか
      let heading = ev.webkitCompassHeading ?? (ev.alpha != null ? (360 - ev.alpha) : null);
      if (heading == null) return;
      // 目的方位 - 現在方位 = 回転量（矢印がどれだけ回れば目的の方を指すか）
      let delta = (targetDeg - heading + 360) % 360;
      arrow.style.transform = `rotate(${delta}deg)`;
      let diff = Math.abs(delta > 180 ? delta - 360 : delta);
      if (diff < 10) {
        hint.textContent = 'その方向です';
        wrap.classList.add('compass-on-target');
      } else if (delta <= 180) {
        hint.textContent = `右に ${Math.round(delta)}°`;
        wrap.classList.remove('compass-on-target');
      } else {
        hint.textContent = `左に ${Math.round(360 - delta)}°`;
        wrap.classList.remove('compass-on-target');
      }
    }

    btn.addEventListener('click', start);
  }

  // ==========================================================
  // 可視時レンダー
  // ==========================================================
  function renderVisible(d) {
    const s = d.result;
    const others = (d.all_trains || []).slice(1);
    const scoreBar = (s.score !== undefined)
      ? `<div class="score-bar" role="progressbar" aria-valuenow="${s.score}" aria-valuemin="0" aria-valuemax="100" aria-label="可視スコア">
           <div class="score-fill" style="width:${s.score}%"></div>
         </div>
         <div class="score-label">見やすさ <strong>${escapeHtml(s.score)}</strong><span class="score-unit">/100</span></div>`
      : '';

    const othersHtml = others.length > 0
      ? `<div class="others">
           <div class="others-label">OTHER CANDIDATES</div>
           ${others.map(o => `
             <div class="other-row">
               <span class="other-time">${escapeHtml(o.time_str)}</span>
               <span class="other-dir">${escapeHtml(o.start_dir)} → ${escapeHtml(o.end_dir)}</span>
               <span class="other-count">${escapeHtml(o.sat_count)}機</span>
               ${o.score !== undefined ? `<span class="other-score">${escapeHtml(o.score)}</span>` : ''}
             </div>`).join('')}
         </div>`
      : '';

    return `
      <div class="visible">
        <div class="status">今夜はスターリンクが<br>西桟橋から見えるかもしれません</div>
        <div class="time">${escapeHtml(s.time_str)}</div>
        <div class="countdown" id="countdown">—</div>
        ${scoreBar}
        <div class="direction">
          ${escapeHtml(s.start_dir)}
          <span class="context">（${escapeHtml(s.start_context)}）</span>
          を見る
        </div>
        <div class="flow" aria-hidden="true">
          <span class="line"></span>
        </div>
        <div class="direction">${escapeHtml(s.end_dir)} へ流れる</div>
        <div class="count">約 ${escapeHtml(s.sat_count)} 機の連なり</div>
        ${othersHtml}
      </div>
    `;
  }

  // ==========================================================
  // 不可視時レンダー
  // ==========================================================
  function renderNotVisible(d) {
    let html = '<div class="not-visible"><div class="status">今夜はスターリンクが<br>西桟橋から見えなそうです</div></div>';

    // 見えない理由
    if (d.reason) {
      const r = d.reason;
      html += `
        <div class="reason-card" role="note">
          <div class="reason-icon" aria-hidden="true">${escapeHtml(r.icon)}</div>
          <div class="reason-title">${escapeHtml(r.title)}</div>
          <div class="reason-detail">${escapeHtml(r.detail)}</div>
        </div>
      `;
    }

    if (d.next_visible) {
      const n = d.next_visible;
      html += `
        <div class="next-hint">
          <div class="next-label">NEXT</div>
          <div class="next-date">${escapeHtml(n.date)} ${escapeHtml(n.time_str)}</div>
          <div class="next-dir">${escapeHtml(n.start_dir)}（${escapeHtml(n.start_context)}）→ ${escapeHtml(n.end_dir)}</div>
        </div>
      `;
    } else if (d.next_dark_sky) {
      const ds = d.next_dark_sky;
      html += `
        <div class="next-hint">
          <div class="next-label">DARK SKY</div>
          <div class="next-date">${escapeHtml(ds.date)}〜 新月期</div>
          <div class="next-dir">月明かりが少なく、星空が深く見える頃</div>
        </div>
      `;
    }
    return html;
  }

  // ==========================================================
  // 月・空・潮（折りたたみ）レンダー
  // ==========================================================
  function renderMoon(m, events, tide, weather) {
    const fmt = v => v ? escapeHtml(v) : '—';
    const phaseEmoji = (m.phase || '').match(/[🌑🌒🌓🌔🌕🌖🌗🌘]/)?.[0] || '🌙';
    const weatherIcon = weather ? cloudIcon(weather.cloud_pct) : '';
    const preview = weather
      ? `${phaseEmoji} 月齢 ${escapeHtml(m.age)} · ${weatherIcon} ${escapeHtml(weather.cloud_pct)}%`
      : `${phaseEmoji} 月齢 ${escapeHtml(m.age)}`;

    let eventsRow = '';
    if (events) {
      eventsRow = `
        <div class="sky-grid">
          <div class="sky-cell"><span class="sky-label">☀ SUNRISE</span><span class="sky-time">${fmt(events.sunrise)}</span></div>
          <div class="sky-cell"><span class="sky-label">SUNSET</span><span class="sky-time">${fmt(events.sunset)}</span></div>
          <div class="sky-cell"><span class="sky-label">🌙 MOONRISE</span><span class="sky-time">${fmt(events.moonrise)}</span></div>
          <div class="sky-cell"><span class="sky-label">MOONSET</span><span class="sky-time">${fmt(events.moonset)}</span></div>
          <div class="sky-cell"><span class="sky-label">🌌 TWILIGHT</span><span class="sky-time">${fmt(events.twilight_start)} 〜 ${fmt(events.twilight_end)}</span></div>
        </div>
      `;
    }

    let weatherRow = '';
    if (weather) {
      const rangeNote = (weather.cloud_pct_min !== undefined && weather.cloud_pct_max !== undefined
        && weather.cloud_pct_max > weather.cloud_pct_min)
        ? `<span class="weather-range">${escapeHtml(weather.cloud_pct_min)}〜${escapeHtml(weather.cloud_pct_max)}%</span>`
        : '';
      weatherRow = `
        <div class="weather-block">
          <div class="weather-line">
            <span class="weather-icon" aria-hidden="true">${weatherIcon}</span>
            <span class="weather-state">${escapeHtml(weather.state_jp)}</span>
            <span class="weather-cloud">雲量 ${escapeHtml(weather.cloud_pct)}%</span>
          </div>
          <div class="weather-note">${escapeHtml(weather.note)} ${rangeNote}</div>
        </div>
      `;
    }

    let tideRow = '';
    if (tide && (tide.highs.length || tide.lows.length)) {
      const highs = tide.highs.map(h => `<li><span class="tide-kind">満潮</span><span class="tide-time">${escapeHtml(h.time)}</span><span class="tide-cm">${escapeHtml(h.cm)} cm</span></li>`).join('');
      const lows  = tide.lows.map(l  => `<li><span class="tide-kind">干潮</span><span class="tide-time">${escapeHtml(l.time)}</span><span class="tide-cm">${escapeHtml(l.cm)} cm</span></li>`).join('');
      tideRow = `
        <div class="tide-block">
          <ul class="tide-list">${highs}${lows}</ul>
          <div class="tide-note">${escapeHtml(tide.datum_note)}</div>
        </div>
      `;
    }

    return `
      <div class="moon-info">
        <button class="moon-toggle" aria-expanded="false" aria-controls="moon-detail-panel">今夜の月・空・潮<span class="moon-toggle-preview">${preview}</span></button>
        <div class="moon-detail" id="moon-detail-panel">
          ${eventsRow}
          ${weatherRow}
          <div class="moon-summary">
            <div class="moon-phase">${escapeHtml(m.phase)}</div>
            <div class="moon-meta">月齢 ${escapeHtml(m.age)}　${escapeHtml(m.tide_type)}</div>
            <div class="moon-note">${escapeHtml(m.sky_note)}</div>
          </div>
          ${tideRow}
        </div>
      </div>
    `;
  }

  function cloudIcon(pct) {
    if (pct == null) return '';
    if (pct < 15) return '☀️';
    if (pct < 35) return '🌤️';
    if (pct < 65) return '⛅';
    if (pct < 85) return '🌥️';
    return '☁️';
  }

  // ==========================================================
  // A2: 観測時刻の自動監視（5分前に "about-to-start" クラス付与）
  // ==========================================================
  let watchTimer = null;
  function watchObsTime(bestTimeStart) {
    if (watchTimer) clearInterval(watchTimer);
    if (!bestTimeStart) return;

    const [h, m] = bestTimeStart.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return;

    function check() {
      const now = new Date();
      const target = new Date(now);
      target.setHours(h, m, 0, 0);
      // すでに目的時刻を過ぎている場合は翌日扱いにしない（今夜の観測時刻は本日の対象）
      const diffMin = (target - now) / 60000;
      const card = document.querySelector('.obs-index');
      if (!card) return;
      if (diffMin <= 5 && diffMin > -30) {
        card.classList.add('about-to-start');
      } else {
        card.classList.remove('about-to-start');
      }
    }
    check();
    watchTimer = setInterval(check, 30 * 1000);
  }

  // ==========================================================
  // メインロード（リトライ・段階メッセージ対応）
  // ==========================================================
  const FETCH_TIMEOUT_MS = 120 * 1000;   // 最大120秒
  const STAGE_TIMEOUTS = [15000, 45000]; // 15秒・45秒でメッセージ変更

  function showLoadingStage(msg, opts) {
    const el = document.getElementById('content');
    if (!el) return;
    const hasProgress = opts && opts.progress;
    const progressHtml = hasProgress ? `
      <div class="loading-progress-wrap" aria-hidden="true">
        <div class="loading-progress-bar"><div class="loading-progress-fill" id="lp-fill"></div></div>
        <div class="loading-progress-meta">
          <span id="lp-elapsed">0:00</span>
          <span id="lp-percent">0%</span>
          <span id="lp-eta">約2分</span>
        </div>
      </div>
    ` : '';
    el.innerHTML = `
      <div class="loading">
        <div class="loading-text" id="lp-text">${escapeHtml(msg)}</div>
        ${progressHtml}
      </div>
    `;
  }

  function updateLoadingText(msg) {
    const el = document.getElementById('lp-text');
    if (el) el.textContent = msg;
  }

  // 非線形プログレス: 30秒で75%、120秒で95%（Renderのスリープ復帰体感に合わせた設計）
  function virtualProgress(elapsedMs) {
    const t = elapsedMs / 1000;
    // 1 - exp(-t / tau) で漸近する曲線。tau=19 で t=30 => 79%, t=120 => 99%
    const raw = 1 - Math.exp(-t / 19);
    return Math.min(0.98, raw) * 100;
  }

  function formatMMSS(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function startProgressTicker(startAt) {
    const fill = document.getElementById('lp-fill');
    const elapsed = document.getElementById('lp-elapsed');
    const percent = document.getElementById('lp-percent');
    if (!fill || !elapsed || !percent) return null;
    const tick = () => {
      const f = document.getElementById('lp-fill');
      const e = document.getElementById('lp-elapsed');
      const p = document.getElementById('lp-percent');
      if (!f || !e || !p) return;
      const dt = Date.now() - startAt;
      const pct = virtualProgress(dt);
      f.style.width = pct + '%';
      e.textContent = formatMMSS(dt);
      p.textContent = Math.round(pct) + '%';
    };
    tick();
    return setInterval(tick, 500);
  }

  function showErrorWithRetry(msg) {
    const el = document.getElementById('content');
    if (!el) return;
    el.innerHTML = `
      <div class="error">
        <div class="status">${escapeHtml(msg)}</div>
        <button class="ics-btn" id="retry-btn" type="button" style="margin-top:1.5rem">
          もう一度試す
        </button>
      </div>
    `;
    const btn = document.getElementById('retry-btn');
    if (btn) btn.addEventListener('click', load);
  }

  async function fetchWithTimeout() {
    const controller = new AbortController();
    const timers = [];
    const startAt = Date.now();
    const progressTimer = startProgressTicker(startAt);
    if (progressTimer) timers.push(progressTimer);
    timers.push(setTimeout(() => updateLoadingText('サーバーを起動しています…'), STAGE_TIMEOUTS[0]));
    timers.push(setTimeout(() => updateLoadingText('もう少しお待ちください…'), STAGE_TIMEOUTS[1]));
    const abortTimer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    timers.push(abortTimer);

    try {
      const r = await fetch('/api/tonight', { signal: controller.signal });
      return await r.json();
    } finally {
      timers.forEach(t => { clearTimeout(t); clearInterval(t); });
    }
  }

  async function load() {
    showLoadingStage('読み込み中…', { progress: true });
    try {
      const d = await fetchWithTimeout();
      if (d.error) {
        showErrorWithRetry(d.error);
        return;
      }
      renderAll(d);
    } catch (e) {
      const msg = e.name === 'AbortError'
        ? '応答が遅いようです。ネットワークをご確認ください'
        : 'データの取得に失敗しました';
      showErrorWithRetry(msg);
    }
  }

  function renderAll(d) {
    const el = document.getElementById('content');
    if (!el) return;
    let html = '';
    html += renderObservationIndex(d);

    if (d.visible && d.result) {
      html += renderVisible(d);
    } else {
      html += renderNotVisible(d);
    }
    if (d.moon) {
      html += renderMoon(d.moon, d.events, d.tide, d.weather);
    }

    el.style.opacity = '0';
    setTimeout(() => {
      el.innerHTML = html;
      el.style.opacity = '1';
      if (d.visible && d.result && d.result.time_iso) {
        startCountdown(d.result.time_iso);
      }
      attachMoonToggle();

      // A1: コンパス連動
      const idx = d.observation_index;
      if (idx) {
        const targetDeg = parseDirectionDeg(idx.best_direction);
        if (targetDeg != null) setupCompass(targetDeg);
        // A2: 観測時刻の監視
        watchObsTime(idx.best_time_start);
      }
    }, 250);
  }

  document.addEventListener('DOMContentLoaded', load);

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();
</script>

</body>
</html>
